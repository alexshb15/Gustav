# Regimes do motor do Bf 109 G-2 (DB 605 A). minutos = 0 significa sem limite.
# Nenhum valor confirmado em voo ainda: são da ficha do jogo, de memória.
# O G-2 não tem regime de emergência; manete todo à frente dá potência de combate.

[[regime]]
nome = "contínuo"
ata = 1.15
rpm = 2300
minutos = 0

[[regime]]
nome = "combate"
ata = 1.30
rpm = 2600
minutos = 30

# Limites dos alertas automáticos. Valores aproximados, a conferir com a ficha do jogo.
[alertas]
aoa_estol = 15.0    # graus de ângulo de ataque para o aviso de estol
carga_g = 8.0       # carga para o aviso de G
flaps_kmh = 250.0   # velocidade máxima com flaps baixados
trem_kmh = 350.0    # velocidade máxima com trem baixado
