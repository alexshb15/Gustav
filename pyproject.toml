[project]
name = "gustav"
version = "0.1.0"
description = "Copiloto de IA por voz para o IL-2 Sturmovik: Great Battles"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "faster-whisper",
    "numpy",
    "piper-tts",
    "python-dotenv",
    "sounddevice",
]

[project.scripts]
gustav = "copilot.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
