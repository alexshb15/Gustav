# Configuração do Gustav. A chave da API fica no .env (ANTHROPIC_API_KEY), não aqui.

[audio]
# Trecho do nome do dispositivo no Windows. Vazio = dispositivo padrão do sistema.
# `python -m copilot.main --dispositivos` lista os nomes.
microfone = "Logitech PRO X"
saida = "Logitech PRO X"

[ptt]
# Tecla de falar: segure para gravar, solte para enviar. Nomes aceitos:
# numpad0..numpad9, f1..f24, ou o código da tecla virtual do Windows (ex.: 0x60).
# As teclas numpadN só existem com o NumLock ligado.
tecla = "numpad0"

[stt]
modelo = "small"        # tiny, base, small, medium
threads = 8             # núcleos de CPU usados na transcrição (medido: 1,2 s com 8, 1,4 s com 4)
# Guarda cada fala e a transcrição em captures/voz/, para avaliar o reconhecimento.
gravar = true
# Vocabulário e frases típicas, que ajudam o Whisper a acertar termos de aviação.
dica = "Piloto de Bf 109 falando com o copiloto Gustav. Gustav, como está o motor? Como estão os flaps? Posso decolar? Qual a porcentagem do manete para subir? Me passa o checklist de pouso. Qual tecla trava a bequilha? O trem está baixado? Qual minha velocidade? Potência de combate, potência de emergência, regime contínuo, ata, RPM, estabilizador, radiador, estol, artilharia antiaérea."

[llm]
modelo = "claude-haiku-4-5"
max_tokens = 300        # respostas são faladas; curtas de propósito
turnos_de_memoria = 10  # trocas anteriores enviadas a cada pergunta

[tts]
voz = "pt_BR-faber-medium"   # baixada em models/
volume = 1.0
velocidade = 1.0             # acima de 1 fala mais rápido

[sistema]
# Roda o copiloto com prioridade abaixo do normal para não disputar CPU com o jogo.
prioridade_baixa = true

[jogo]
# Pasta de instalação do IL-2; de data/input saem as teclas configuradas.
pasta = 'E:\SteamLibrary\steamapps\common\IL-2 Sturmovik Battle of Stalingrad'
